<!DOCTYPE html>
<html lang = "ru">

<head>
    <meta charset="UTF-8">
    <title>Заявка маршрута БПЛА</title>
    <link rel="stylesheet" href="route_interface.css">
</head>

<body>
    <div class="uav-panel">
        <div id="route-result" class="result">
            0
        </div>

        <div>
            <div>
                <button id="btn_nav_clear" class="uav-btn secondary">C</button>
                <button id="btn_nav_sign" class="uav-btn secondary">+/-</button>
                <button id="btn_nav_percent" class="uav-btn secondary">%</button>
                <button id="btn_nav_div" class="uav-btn primary">/</button>
            </div>

            <div>
                <button id="btn_coord_7" class="uav-btn">7</button>
                <button id="btn_coord_8" class="uav-btn">8</button>
                <button id="btn_coord_9" class="uav-btn">9</button>
                <button id="btn_nav_mult" class="uav-btn primary">x</button>
            </div>

            <div>
                <button id="btn_coord_4" class="uav-btn">4</button>
                <button id="btn_coord_5" class="uav-btn">5</button>
                <button id="btn_coord_6" class="uav-btn">6</button>
                <button id="btn_nav_minus" class="uav-btn primary">-</button>
            </div>

            <div>
                <button id="btn_coord_1" class="uav-btn">1</button>
                <button id="btn_coord_2" class="uav-btn">2</button>
                <button id="btn_coord_3" class="uav-btn">3</button>
                <button id="btn_nav_plus" class="uav-btn primary">+</button>
            </div>

            <div>
                <button id="btn_coord_0" class="uav-btn">0</button>
                <button id="btn_coord_dot" class="uav-btn">.</button>
                <button id="btn_nav_equal" class="uav-btn primary execute">=</button>
            </div>
        </div>
    </div>

    <div class="info-uav-panel">
        <a href="https://github.com/JavyBinary/uav-route-control-system/tree/main" target="_blank" class="github-icon-btn">
            <img src="github-icon.png">
        </a>

        <details class="operator-details">
            <summary>Оператор</summary>
            <p>Чоботов Лука</p>
        </details>
    </div>
</body>

</html>
