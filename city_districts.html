<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контроль районов</title>
    <link rel="stylesheet" href="city_districts.css">
    <script type="text/javascript" src="city_districts.js"></script>
</head>
<body>
    <div class="calculator-container">
        <div id="route-result" class="result">0</div>

        <div class="buttons-grid">
            <button id="btn_nav_clear" class="btn">C</button>
            <button id="btn_nav_sign" class="btn">+/-</button>
            <button id="btn_nav_percent" class="btn">%</button>
            <button id="btn_nav_div" class="btn primary">/</button>

            <button id="btn_coord_7" class="btn">7</button>
            <button id="btn_coord_8" class="btn">8</button>
            <button id="btn_coord_9" class="btn">9</button>
            <button id="btn_nav_mult" class="btn primary">x</button>

            <button id="btn_coord_4" class="btn">4</button>
            <button id="btn_coord_5" class="btn">5</button>
            <button id="btn_coord_6" class="btn">6</button>
            <button id="btn_nav_minus" class="btn primary">-</button>

            <button id="btn_coord_1" class="btn">1</button>
            <button id="btn_coord_2" class="btn">2</button>
            <button id="btn_coord_3" class="btn">3</button>
            <button id="btn_nav_plus" class="btn primary">+</button>

            <button id="btn_coord_0" class="btn">0</button>
            <button id="btn_coord_dot" class="btn">.</button>
            
            <button id="btn_op_density" class="btn primary">Плотн.</button>
            <button id="btn_nav_equal" class="btn primary execute">=</button>
        </div>
        <div class="info-panel">
        <a href="https://github.com/JavyBinary/uav-route-control-system/tree/main" target="_blank" class="btn primary github-btn">
            GitHub
        </a>

        <details class="operator-details">
            <summary>Оператор</summary>
            <p>Чоботов Лука</p>
        </details>
    </div>
    </div>
</body>
</html>
